<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XSL-FO Professional Sandbox v6</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --bg: #525659; --panel-bg: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: var(--primary); color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        main { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 520px; display: flex; flex-direction: column; border-right: 2px solid #333; background: #252526; color: #ccc; }
        .tabs { display: flex; background: #333; }
        .tab { flex: 1; padding: 10px; cursor: pointer; text-align: center; font-size: 0.75rem; border-bottom: 2px solid transparent; }
        .tab.active { background: var(--panel-bg); color: white; border-bottom: 2px solid var(--accent); }
        textarea { flex: 1; font-family: 'Fira Code', monospace; font-size: 12px; padding: 15px; border: none; outline: none; background: var(--panel-bg); color: #d4d4d4; resize: none; }
        #library-list { padding: 10px; background: #2d2d2d; border-radius: 4px; max-height: 200px; overflow-y: auto; }
        .lib-item { font-size: 0.7rem; display: flex; justify-content: space-between; padding: 6px; border-bottom: 1px solid #3d3d3d; align-items: center; }
        #preview-zone { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; background: var(--bg); gap: 40px; }
        #xsl-canvas { display: flex; flex-direction: column; align-items: center; gap: 40px; }
        .xsl-page { background: white; width: 210mm; min-height: 297mm; box-shadow: 0 10px 30px rgba(0,0,0,0.5); outline: none; color: black; box-sizing: border-box; display: flex; flex-direction: column; position: relative; }
        .xsl-region-before { flex-shrink: 0; min-height: 15mm; padding: 5mm 20mm; border-bottom: 1px dashed #ccc; background: #fafafa; }
        .xsl-region-body { flex: 1; padding: 15mm; overflow: hidden; } /* Default padding, overridden by fo:region-body margin */
        .xsl-region-after { flex-shrink: 0; min-height: 15mm; padding: 5mm 20mm; border-top: 1px dashed #ccc; background: #fafafa; }
        .fo-page-number { background-color: #e3f2fd; padding: 0 3px; border-radius: 2px; }
        .fo-page-number-citation-last { background-color: #e8f5e9; padding: 0 3px; border-radius: 2px; }
        .page-break-marker { display: none; }
        button { cursor: pointer; border: none; border-radius: 4px; padding: 6px 12px; font-weight: 600; }
        .btn-primary { background: var(--accent); color: white; }
        .status-msg { font-size: 0.7rem; color: #aaa; margin-right: 15px; }
        .toggle-option { font-size: 0.7rem; color: #ccc; margin-right: 15px; display: inline-flex; align-items: center; gap: 4px; }
        .toggle-option input { margin: 0; }
        .fo-leader-fill { flex: 1; min-width: 1em; align-self: center; }
        .fo-leader-fill.pattern-dots { border-bottom: 1px dotted currentColor; margin: 0 0.3em; }
        .fo-leader-fill.pattern-rule { border-bottom: 1px solid currentColor; margin: 0 0.3em; }
        .fo-leader-fill.pattern-space { margin: 0 0.3em; }
        /* Snippet Toolbar Styles */
        .snippet-toolbar {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 6px 10px;
            background: #333;
            border-bottom: 1px solid #444;
        }
        .snippet-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }
        .snippet-label {
            font-size: 0.6rem;
            color: #888;
            width: 28px;
            text-transform: uppercase;
        }
        .snippet-toolbar button {
            font-size: 0.65rem;
            padding: 3px 6px;
            background: #444;
            color: #ccc;
            border: 1px solid #555;
            border-radius: 3px;
            cursor: pointer;
        }
        .snippet-toolbar button:hover {
            background: #555;
            color: white;
        }
        .snippet-toolbar select {
            font-size: 0.65rem;
            padding: 2px 4px;
            background: #444;
            color: #ccc;
            border: 1px solid #555;
            border-radius: 3px;
            max-width: 150px;
        }
        /* Table Dialog Styles */
        .table-dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .table-dialog {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            color: #ccc;
            min-width: 280px;
        }
        .table-dialog h3 {
            margin: 0 0 15px 0;
            color: white;
        }
        .table-dialog label {
            display: block;
            margin: 10px 0 5px;
            font-size: 0.8rem;
        }
        .table-dialog input[type="number"] {
            width: 60px;
            padding: 4px;
            background: #444;
            border: 1px solid #555;
            color: white;
            border-radius: 3px;
        }
        .table-dialog input[type="checkbox"] {
            margin-right: 8px;
        }
        .table-dialog-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        /* Project Dialog Styles */
        .project-dialog {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            color: #ccc;
            min-width: 450px;
            max-width: 550px;
        }
        .project-dialog h3 {
            margin: 0 0 15px 0;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .project-dialog h3 button {
            background: none;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0;
        }
        .project-dialog h3 button:hover {
            color: white;
        }
        .project-current {
            background: #383838;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .project-current-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .project-current-name {
            font-size: 1rem;
            color: #4fc3f7;
            font-weight: bold;
        }
        .project-current-name.unsaved {
            color: #ffa726;
            font-style: italic;
        }
        .project-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .project-actions button {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.75rem;
            border-radius: 4px;
            border: 1px solid #555;
            cursor: pointer;
        }
        .project-actions .btn-save {
            background: #2e7d32;
            color: white;
            border-color: #388e3c;
        }
        .project-actions .btn-save:hover {
            background: #388e3c;
        }
        .project-actions .btn-save:disabled {
            background: #555;
            border-color: #666;
            color: #888;
            cursor: not-allowed;
        }
        .project-actions .btn-saveas {
            background: #1565c0;
            color: white;
            border-color: #1976d2;
        }
        .project-actions .btn-saveas:hover {
            background: #1976d2;
        }
        .project-actions .btn-new {
            background: #444;
            color: #ccc;
        }
        .project-actions .btn-new:hover {
            background: #555;
            color: white;
        }
        .project-list-header {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #444;
        }
        .project-list {
            max-height: 250px;
            overflow-y: auto;
        }
        .project-list-empty {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
        .project-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #3a3a3a;
            gap: 10px;
        }
        .project-item:hover {
            background: #383838;
        }
        .project-item-info {
            flex: 1;
        }
        .project-item-name {
            font-size: 0.85rem;
            color: #ddd;
        }
        .project-item-date {
            font-size: 0.65rem;
            color: #888;
        }
        .project-item button {
            padding: 5px 10px;
            font-size: 0.7rem;
            border-radius: 3px;
            border: 1px solid #555;
            cursor: pointer;
        }
        .project-item .btn-load {
            background: #1565c0;
            color: white;
            border-color: #1976d2;
        }
        .project-item .btn-load:hover {
            background: #1976d2;
        }
        .project-item .btn-delete {
            background: #c62828;
            color: white;
            border-color: #d32f2f;
        }
        .project-item .btn-delete:hover {
            background: #d32f2f;
        }
        /* Help Mode Dialog Styles */
        .help-dialog {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            color: #ccc;
            min-width: 420px;
            max-width: 520px;
            align-self: flex-start;
            margin-top: 50px;
        }
        .help-dialog h3 {
            margin: 0 0 5px 0;
            color: white;
        }
        .help-dialog .help-subtitle {
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 15px;
        }
        .help-attr-list {
            max-height: 570px;
            overflow-y: auto;
        }
        .help-attr-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid #3a3a3a;
        }
        .help-attr-row:last-child {
            border-bottom: none;
        }
        .help-attr-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .help-attr-row .attr-name {
            width: 180px;
            font-size: 0.75rem;
            color: #4fc3f7;
            flex-shrink: 0;
        }
        .help-attr-row input[type="text"] {
            width: 120px;
            flex-shrink: 0;
            padding: 4px 6px;
            font-size: 0.75rem;
            background: #444;
            border: 1px solid #555;
            color: white;
            border-radius: 3px;
        }
        .help-dialog-buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        /* Template Navigator Bar */
        .template-nav-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: #2a2a2a;
        }
        .template-nav-bar label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
        }
        .template-nav-bar select {
            flex: 1;
            font-size: 0.75rem;
            padding: 5px 8px;
            background: #383838;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 3px;
        }
        .template-nav-bar button {
            font-size: 0.7rem;
            padding: 5px 10px;
            background: #444;
            color: #ccc;
            border: 1px solid #555;
            border-radius: 3px;
        }
        .template-nav-bar button:hover {
            background: #555;
            color: white;
        }
        /* Template Editor */
        .template-editor {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 150px;
            background: #1a1a1a;
            border-top: 1px solid #444;
        }
        .template-editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: #2a2a2a;
            border-bottom: 1px solid #333;
        }
        .template-editor-header .template-name {
            font-size: 0.75rem;
            color: #4fc3f7;
            font-weight: bold;
        }
        .template-editor-header .template-status {
            font-size: 0.65rem;
            color: #888;
        }
        .template-editor-header .template-status.modified {
            color: #ffa726;
        }
        .template-editor-buttons {
            display: flex;
            gap: 6px;
        }
        .template-editor-buttons button {
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 3px;
            border: 1px solid #555;
        }
        .template-editor-buttons .btn-update {
            background: #2e7d32;
            color: white;
            border-color: #388e3c;
        }
        .template-editor-buttons .btn-update:hover {
            background: #388e3c;
        }
        .template-editor-buttons .btn-discard {
            background: #444;
            color: #ccc;
        }
        .template-editor-buttons .btn-discard:hover {
            background: #555;
            color: white;
        }
        .template-editor textarea {
            flex: 1;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            padding: 10px;
            border: none;
            outline: none;
            background: #1a1a1a;
            color: #d4d4d4;
            resize: none;
        }
        .template-editor-placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 0.8rem;
            font-style: italic;
        }
        /* Bottom Tabs */
        .bottom-tabs-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 200px;
            border-top: 1px solid #444;
        }
        .bottom-tabs {
            display: flex;
            background: #252526;
            border-bottom: 1px solid #444;
        }
        .bottom-tab {
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.65rem;
            color: #888;
            border-bottom: 2px solid transparent;
            text-transform: uppercase;
        }
        .bottom-tab:hover {
            color: #ccc;
        }
        .bottom-tab.active {
            color: white;
            border-bottom-color: var(--accent);
            background: #2d2d2d;
        }
        .bottom-tab-content {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .bottom-tab-content.active {
            display: flex;
        }
        /* Options Panel */
        .options-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: var(--panel-bg);
        }
        .options-section {
            padding: 15px;
            border-bottom: 1px solid #333;
        }
        .options-section h4 {
            margin: 0 0 10px 0;
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }
        .options-section label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #ccc;
            cursor: pointer;
        }
        .options-section label:hover {
            color: white;
        }
        .options-section input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body onload="initProject()">

<header>
    <div><strong>XSL-FO Designer</strong> <small>| v6 Master Baseline</small></div>
    <div>
        <span id="render-status" class="status-msg"></span>
        <span id="save-status" class="status-msg"></span>
        <button class="btn-primary" onclick="renderPreview()">Render Preview & Save</button>
        <button onclick="showProjectDialog()" style="background:#6a1b9a; color:white; margin-left:10px;">📁 Projects</button>
    </div>
</header>

<main>
	<div class="sidebar">
		<div class="tabs">
			<div id="tab-xsl" class="tab active" onclick="showTab('xsl')">XSLT</div>
			<div id="tab-xml" class="tab" onclick="showTab('xml')">XML DATA</div>
			<div id="tab-map" class="tab" onclick="showTab('map')">JAVA MAP</div>
			<div id="tab-img" class="tab" onclick="showTab('img')">IMAGES</div>
			<div id="tab-shims" class="tab" onclick="showTab('shims')">SHIMS</div>
			<div id="tab-options" class="tab" onclick="showTab('options')">OPTIONS</div>
		</div>

		<div id="snippet-toolbar" class="snippet-toolbar">
			<div class="snippet-row">
				<span class="snippet-label">FO:</span>
				<button onclick="insertSnippet('block')" title="Insert fo:block">block</button>
				<button onclick="insertSnippet('inline')" title="Insert fo:inline">inline</button>
				<button onclick="insertSnippet('inline-container')" title="Insert fo:inline-container">container</button>
				<button onclick="showTableDialog()" title="Insert fo:table">table...</button>
				<button onclick="insertSnippet('leader')" title="Insert fo:leader">leader</button>
				<button onclick="insertSnippet('graphic')" title="Insert fo:external-graphic">graphic</button>
				<button onclick="showCommentDialog()" title="Insert XSL comment" style="background:#5a5a2a;">comment</button>
			</div>
			<div class="snippet-row">
				<span class="snippet-label">XSL:</span>
				<button onclick="showTemplateDialog()" title="Insert xsl:template">template...</button>
				<button onclick="showCallTemplateDialog()" title="Insert xsl:call-template">call...</button>
				<button onclick="insertSnippet('for-each')" title="Insert xsl:for-each">for-each</button>
				<button onclick="insertSnippet('if')" title="Insert xsl:if">if</button>
				<button onclick="insertSnippet('choose')" title="Insert xsl:choose">choose</button>
				<button onclick="insertSnippet('value-of')" title="Insert xsl:value-of">value-of</button>
				<button onclick="showAttrSetDialog()" title="Insert xsl:attribute-set">attr set...</button>
			</div>
		</div>

		<textarea id="xslInput" oninput="saveProject()" placeholder="Paste Main XSLT..."></textarea>
		<textarea id="xmlInput" style="display:none;" oninput="saveProject()" placeholder="Paste XML Data..."></textarea>
		<textarea id="mapInput" style="display:none;" oninput="saveProject()" placeholder='{ "reportTitle": "Invoice" }'></textarea>
		<textarea id="imageMapInput" style="display:none;" oninput="saveProject()" placeholder="logo.png|data:image/png;base64,..."></textarea>
		<textarea id="shimInput" style="display:none;" oninput="saveProject()" placeholder="OriginalText|ReplacementText"></textarea>

		<!-- Options Panel (hidden by default) -->
		<div id="optionsPanel" class="options-panel" style="display: none;">
			<div class="options-section">
				<h4>Editor Options</h4>
				<label title="Show attribute selection dialogs when inserting FO elements">
					<input type="checkbox" id="helpModeToggle" onchange="saveProject()" checked>
					Help Mode (show attribute dialogs for snippets)
				</label>
			</div>
			<div class="options-section">
				<h4>Rendering Options</h4>
				<label title="Enable flexbox-based leaders that fill available space (may affect some layouts)">
					<input type="checkbox" id="flexLeadersToggle" onchange="saveProject()">
					Flex Leaders (fill available space)
				</label>
			</div>
			<div class="options-section">
				<h4>Include Library</h4>
				<div id="library-list"></div>
				<div style="display: flex; gap: 5px; margin-top: 10px;">
					<input type="text" id="lib-name" placeholder="filename.xsl" style="flex:1; font-size:0.75rem; background:#333; color:white; border:1px solid #444; padding:6px; border-radius:3px;">
					<button onclick="addLibFile()" style="font-size:0.7rem; padding: 6px 12px;">Add File</button>
				</div>
			</div>
		</div>

		<!-- Bottom Tabs Container -->
		<div id="bottom-tabs-container" class="bottom-tabs-container">
			<div class="bottom-tabs">
				<div id="bottom-tab-templates" class="bottom-tab active" onclick="showBottomTab('templates')">TEMPLATES</div>
				<div id="bottom-tab-attrsets" class="bottom-tab" onclick="showBottomTab('attrsets')">ATTRIBUTE SETS</div>
			</div>

			<!-- TEMPLATES Tab Content -->
			<div id="bottom-content-templates" class="bottom-tab-content active">
				<!-- Template Navigator -->
				<div id="template-nav-bar" class="template-nav-bar">
					<label>Templates:</label>
					<select id="template-nav" onchange="loadTemplateToEditor(this.value)" title="Select template to edit">
						<option value="">-- Select a template --</option>
					</select>
					<button onclick="refreshTemplateNav()" title="Refresh template list">↻</button>
				</div>

				<!-- Template Editor -->
				<div id="template-editor" class="template-editor">
					<div id="template-editor-placeholder" class="template-editor-placeholder">
						Select a template above to edit
					</div>
					<div id="template-editor-active" style="display: none; flex: 1; flex-direction: column;">
						<div class="template-editor-header">
							<span class="template-name" id="template-editor-name"></span>
							<span class="template-status" id="template-editor-status"></span>
							<div class="template-editor-buttons">
								<button class="btn-discard" onclick="discardTemplateChanges()" title="Reload from main XSL">Discard</button>
								<button class="btn-update" onclick="updateTemplateInXsl()" title="Update template in main XSL">Update XSL</button>
							</div>
						</div>
						<textarea id="templateEditorInput" oninput="onTemplateEditorChange()" placeholder="Template content..."></textarea>
					</div>
				</div>
			</div>

			<!-- ATTRIBUTE SETS Tab Content -->
			<div id="bottom-content-attrsets" class="bottom-tab-content">
				<!-- Attribute Set Navigator -->
				<div class="template-nav-bar">
					<label>Attr Sets:</label>
					<select id="attrset-nav" onchange="loadAttrSetToEditor(this.value)" title="Select attribute set to edit">
						<option value="">-- Select an attribute set --</option>
					</select>
					<button onclick="refreshAttrSetNav()" title="Refresh attribute set list">↻</button>
				</div>

				<!-- Attribute Set Editor -->
				<div id="attrset-editor" class="template-editor">
					<div id="attrset-editor-placeholder" class="template-editor-placeholder">
						Select an attribute set above to edit
					</div>
					<div id="attrset-editor-active" style="display: none; flex: 1; flex-direction: column;">
						<div class="template-editor-header">
							<span class="template-name" id="attrset-editor-name"></span>
							<span class="template-status" id="attrset-editor-status"></span>
							<div class="template-editor-buttons">
								<button class="btn-discard" onclick="discardAttrSetChanges()" title="Reload from main XSL">Discard</button>
								<button class="btn-update" onclick="updateAttrSetInXsl()" title="Update attribute set in main XSL">Update XSL</button>
							</div>
						</div>
						<textarea id="attrSetEditorInput" oninput="onAttrSetEditorChange()" placeholder="Attribute set content..."></textarea>
					</div>
				</div>
			</div>
		</div>

		<div style="padding: 10px; background: #252526; border-top: 1px solid #444;">
			<button onclick="copyXsltToClipboard()" style="width: 100%; background: #007acc; color: white; border: none; padding: 8px; cursor: pointer; font-weight: bold;">
				COPY XSLT TO CLIPBOARD
			</button>
		</div>

	</div>
	
    <div id="preview-zone">
        <div id="xsl-canvas"></div>
    </div>
</main>

<script>
/*
 * Notes:

	function initProject() {
        const saved = localStorage.getItem('xslfo_sandbox_v6');
        if (saved) {
            const data = JSON.parse(saved);

            // 1. Populate Textareas
            document.getElementById('xslInput').value = data.xsl || '';
            document.getElementById('xmlInput').value = data.xml || '';
            document.getElementById('mapInput').value = data.map || '';

            // 2. Load the new Images Tab content
            document.getElementById('imageMapInput').value = data.img || '';

			// 2b. Load Persistent Shims
			if(document.getElementById('shimInput')) document.getElementById('shimInput').value = data.shims || '';

			// 2c. Load Toggle States
			if(document.getElementById('flexLeadersToggle')) document.getElementById('flexLeadersToggle').checked = data.flexLeaders === true; // Default to false
			if(document.getElementById('helpModeToggle')) document.getElementById('helpModeToggle').checked = data.helpMode !== false; // Default to true

            // 3. Re-hydrate the Library object
            library = data.library || {};

            // 3b. Re-hydrate Templates storage
            templates = data.templates || {};
            activeTemplate = data.activeTemplate || null;

            // 3c. Re-hydrate Attribute Sets storage
            attrSets = data.attrSets || {};
            activeAttrSet = data.activeAttrSet || null;

            // 3d. Re-hydrate Project tracking
            currentProjectId = data.currentProjectId || null;
            // Set lastSavedState if we have a saved project
            if (currentProjectId) {
                const projectData = localStorage.getItem('xslfo_project_' + currentProjectId);
                if (projectData) {
                    lastSavedState = projectData;
                }
            }

            renderLibUI();

            // 4. Initial Render
            if (data.xsl) renderPreview();

            // 5. Restore active template in editor if any
            if (activeTemplate && templates[activeTemplate]) {
                showTemplateEditor(activeTemplate, templates[activeTemplate]);
            }

            // 5b. Restore active attribute set in editor if any
            if (activeAttrSet && attrSets[activeAttrSet]) {
                showAttrSetEditor(activeAttrSet, attrSets[activeAttrSet]);
            }

            // 6. Refresh navigators
            refreshTemplateNav();
            refreshAttrSetNav();
        }
    }

    function saveProject() {
        const data = {
            xsl: document.getElementById('xslInput').value,
            xml: document.getElementById('xmlInput').value,
            map: document.getElementById('mapInput').value,
            img: document.getElementById('imageMapInput').value, // Save Images
			shims: document.getElementById('shimInput')?.value || '', // Save Shims
			flexLeaders: document.getElementById('flexLeadersToggle')?.checked ?? true, // Save toggle
			helpMode: document.getElementById('helpModeToggle')?.checked ?? true, // Save help mode
            library: library,
            templates: templates,           // Save template editor contents
            activeTemplate: activeTemplate, // Save which template is open
            attrSets: attrSets,             // Save attribute set editor contents
            activeAttrSet: activeAttrSet,   // Save which attribute set is open
            currentProjectId: currentProjectId  // Save which project is loaded
        };
        localStorage.setItem('xslfo_sandbox_v6', JSON.stringify(data));
        
        // Visual feedback in the header
        const status = document.getElementById('save-status');
        if (status) {
            status.innerText = `Auto-saved: ${new Date().toLocaleTimeString()}`;
        }
    }
	
    // ===== PROJECT MANAGEMENT =====

	function getProjectsIndex() {
		const stored = localStorage.getItem('xslfo_projects_index');
		return stored ? JSON.parse(stored) : {};
	}

	function saveProjectsIndex(index) {
		localStorage.setItem('xslfo_projects_index', JSON.stringify(index));
	}

	function getCurrentState() {
		return {
			xsl: document.getElementById('xslInput').value,
			xml: document.getElementById('xmlInput').value,
			map: document.getElementById('mapInput').value,
			img: document.getElementById('imageMapInput').value,
			shims: document.getElementById('shimInput')?.value || '',
			flexLeaders: document.getElementById('flexLeadersToggle')?.checked ?? true,
			library: library,
			templates: templates,
			activeTemplate: activeTemplate,
			attrSets: attrSets,
			activeAttrSet: activeAttrSet
		};
	}

	function hasUnsavedChanges() {
		if (!lastSavedState) return true; // Never saved
		const current = JSON.stringify(getCurrentState());
		return current !== lastSavedState;
	}

	function showProjectDialog() {
		const index = getProjectsIndex();
		const projectList = Object.entries(index)
			.sort((a, b) => b[1].lastModified - a[1].lastModified);

		const currentName = currentProjectId ? index[currentProjectId]?.name : null;
		const hasChanges = hasUnsavedChanges();

		const overlay = document.createElement('div');
		overlay.className = 'table-dialog-overlay';
		overlay.id = 'project-dialog-overlay';
		overlay.innerHTML = `
			<div class="project-dialog">
				<h3>
					Project Management
					<button onclick="closeProjectDialog()" title="Close">&times;</button>
				</h3>
				<div class="project-current">
					<div class="project-current-label">Current Project</div>
					<div class="project-current-name ${currentName ? '' : 'unsaved'}">
						${currentName || 'Unsaved Project'}
						${hasChanges ? ' <span style="color:#ffa726;font-size:0.7rem;">(unsaved changes)</span>' : ''}
					</div>
				</div>
				<div class="project-actions">
					<button class="btn-save" onclick="saveCurrentProject()" ${currentProjectId ? '' : 'disabled'} title="${currentProjectId ? 'Save to current project' : 'Use Save As for new projects'}">
						Save
					</button>
					<button class="btn-saveas" onclick="saveProjectAs()" title="Save as new project">
						Save As...

	function closeProjectDialog() {
		const overlay = document.getElementById('project-dialog-overlay');
		if (overlay) overlay.remove();
	}

	function formatDate(timestamp) {
		const date = new Date(timestamp);
		const now = new Date();
		const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));

		if (diffDays === 0) {
			return 'Today ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
		} else if (diffDays === 1) {
			return 'Yesterday ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
		} else if (diffDays < 7) {
			return date.toLocaleDateString([], { weekday: 'short' }) + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
		} else {
			return date.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
		}
	}

	function saveCurrentProject() {
		if (!currentProjectId) {
			saveProjectAs();
			return;
		}

		const state = getCurrentState();
		localStorage.setItem('xslfo_project_' + currentProjectId, JSON.stringify(state));

		// Update index with new timestamp
		const index = getProjectsIndex();
		if (index[currentProjectId]) {
			index[currentProjectId].lastModified = Date.now();
			saveProjectsIndex(index);
		}

		lastSavedState = JSON.stringify(state);

		// Also update working state
		saveProject();

		closeProjectDialog();
		showSaveConfirmation('Project saved!');
	}

	function saveProjectAs() {
		const name = prompt('Enter project name:');
		if (!name || !name.trim()) return;

		const projectId = 'proj_' + Date.now();
		const state = getCurrentState();

		// Save project data
		localStorage.setItem('xslfo_project_' + projectId, JSON.stringify(state));

		// Update index
		const index = getProjectsIndex();
		index[projectId] = {
			name: name.trim(),
			lastModified: Date.now()
		};
		saveProjectsIndex(index);

		// Set as current project
		currentProjectId = projectId;
		lastSavedState = JSON.stringify(state);

		// Update working state
		saveProject();

		closeProjectDialog();
		showSaveConfirmation('Project saved as "' + name.trim() + '"');
	}

	function loadProject(projectId) {
		// Check for unsaved changes
		if (hasUnsavedChanges()) {
			const index = getProjectsIndex();
			const currentName = currentProjectId ? index[currentProjectId]?.name : 'current project';
			const choice = confirm(
				`You have unsaved changes in ${currentName || 'the current project'}.\n\n` +
				`Click OK to discard changes and load the new project.\n` +
				`Click Cancel to go back and save first.`
			);
			if (!choice) return;
		}

		const stored = localStorage.getItem('xslfo_project_' + projectId);
		if (!stored) {
			alert('Project not found!');
			return;
		}

		const data = JSON.parse(stored);

		// Load into UI
		document.getElementById('xslInput').value = data.xsl || '';
		document.getElementById('xmlInput').value = data.xml || '';
		document.getElementById('mapInput').value = data.map || '';
		document.getElementById('imageMapInput').value = data.img || '';
		if (document.getElementById('shimInput')) document.getElementById('shimInput').value = data.shims || '';
		if (document.getElementById('flexLeadersToggle')) document.getElementById('flexLeadersToggle').checked = data.flexLeaders === true;

		library = data.library || {};
		templates = data.templates || {};
		activeTemplate = data.activeTemplate || null;
		attrSets = data.attrSets || {};
		activeAttrSet = data.activeAttrSet || null;

		renderLibUI();

		// Update current project tracking
		currentProjectId = projectId;
		lastSavedState = JSON.stringify(data);

		// Save as working state
		saveProject();

		// Refresh UI
		if (data.xsl) renderPreview();
		refreshTemplateNav();
		refreshAttrSetNav();
		if (activeTemplate && templates[activeTemplate]) {
			showTemplateEditor(activeTemplate, templates[activeTemplate]);
		} else {
			hideTemplateEditor();
		}
		if (activeAttrSet && attrSets[activeAttrSet]) {
			showAttrSetEditor(activeAttrSet, attrSets[activeAttrSet]);
		} else {
			hideAttrSetEditor();
		}

		closeProjectDialog();

		const index = getProjectsIndex();
		showSaveConfirmation('Loaded "' + index[projectId].name + '"');
	}

	function deleteProject(projectId) {
		const index = getProjectsIndex();
		const projectName = index[projectId]?.name || 'this project';

		if (!confirm(`Delete "${projectName}"?\n\nThis cannot be undone.`)) return;

		// Remove project data
		localStorage.removeItem('xslfo_project_' + projectId);

		// Remove from index
		delete index[projectId];
		saveProjectsIndex(index);

		// If we deleted the current project, clear the reference
		if (projectId === currentProjectId) {
			currentProjectId = null;
			lastSavedState = null;
		}

		// Refresh dialog
		closeProjectDialog();
		showProjectDialog();
	}

	function newProject() {
		// Check for unsaved changes
		if (hasUnsavedChanges()) {
			const index = getProjectsIndex();
			const currentName = currentProjectId ? index[currentProjectId]?.name : 'current project';
			const choice = confirm(
				`You have unsaved changes in ${currentName || 'the current project'}.\n\n` +
				`Click OK to discard changes and start a new project.\n` +
				`Click Cancel to go back and save first.`
			);
			if (!choice) return;
		}

		// Clear everything
		document.getElementById('xslInput').value = '';
		document.getElementById('xmlInput').value = '';
		document.getElementById('mapInput').value = '';
		document.getElementById('imageMapInput').value = '';
		if (document.getElementById('shimInput')) document.getElementById('shimInput').value = '';
		if (document.getElementById('flexLeadersToggle')) document.getElementById('flexLeadersToggle').checked = false;

		library = {};
		templates = {};
		activeTemplate = null;
		attrSets = {};
		activeAttrSet = null;
		currentProjectId = null;
		lastSavedState = null;

		renderLibUI();
		hideTemplateEditor();
		hideAttrSetEditor();
		refreshTemplateNav();
		refreshAttrSetNav();
		document.getElementById('xsl-canvas').innerHTML = '';

		saveProject();
		closeProjectDialog();
		showSaveConfirmation('New project started');
	}

	function showSaveConfirmation(message) {
		const status = document.getElementById('save-status');
		if (status) {
			status.innerText = message;
			status.style.color = '#4fc3f7';
			setTimeout(() => {
				status.style.color = '';
			}, 2000);
		}
	}

	async function copyXsltToClipboard() {
		const xslContent = document.getElementById('xslInput').value;
		try {
			await navigator.clipboard.writeText(xslContent);
			// Visual feedback
			const btn = event.target;
			const originalText = btn.innerText;
			btn.innerText = "✓ COPIED!";
			btn.style.background = "#28a745";
			setTimeout(() => {
				btn.innerText = originalText;
				btn.style.background = "#007acc";
			}, 2000);
		} catch (err) {
			console.error('Failed to copy: ', err);
		}
	}

	function preProcessXslt(rawStr) {
		let processed = rawStr;
		
		// 1. Build dynamic shim map from hardcoded + user input
		let activeShims = { ...XSLT_SHIMS };
		const shimEl = document.getElementById('shimInput');
		if (shimEl && shimEl.value) {
			shimEl.value.split('\n').forEach(line => {
				const [target, replacement] = line.split('|');
				if (target && replacement) activeShims[target.trim()] = replacement.trim();
			});
		}

		// 2. Apply the shims
		for (const [target, replacement] of Object.entries(activeShims)) {
			// Use a global regex to replace all instances
			const escapedTarget = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
			const re = new RegExp(escapedTarget, 'g');
			processed = processed.replace(re, replacement);
		}
		
		return processed;
	}

	function showTab(tabName) {
		// 1. Update tab styling
		document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
		document.getElementById('tab-' + tabName).classList.add('active');

		// 2. Toggle textareas (hide all for options tab)
		const isOptionsTab = tabName === 'options';
		document.getElementById('xslInput').style.display = (tabName === 'xsl' ? 'block' : 'none');
		document.getElementById('xmlInput').style.display = (tabName === 'xml' ? 'block' : 'none');
		document.getElementById('mapInput').style.display = (tabName === 'map' ? 'block' : 'none');
		document.getElementById('imageMapInput').style.display = (tabName === 'img' ? 'block' : 'none');
		if(document.getElementById('shimInput')) document.getElementById('shimInput').style.display = (tabName === 'shims' ? 'block' : 'none');

		// 3. Toggle snippet toolbar visibility (only show for XSLT tab)
		const snippetToolbar = document.getElementById('snippet-toolbar');
		if (snippetToolbar) snippetToolbar.style.display = (tabName === 'xsl' ? 'flex' : 'none');

		// 4. Toggle bottom tabs container (only show for XSLT tab)
		const bottomTabsContainer = document.getElementById('bottom-tabs-container');
		if (bottomTabsContainer) bottomTabsContainer.style.display = (tabName === 'xsl' ? 'flex' : 'none');

		// 5. Toggle options panel
		const optionsPanel = document.getElementById('optionsPanel');
		if (optionsPanel) optionsPanel.style.display = (isOptionsTab ? 'flex' : 'none');

		// 6. Refresh navigators when switching to XSLT tab
		if (tabName === 'xsl') {
			refreshTemplateNav();
			refreshAttrSetNav();
		}
	}

	function showBottomTab(tabName) {
		// Update bottom tab styling
		document.querySelectorAll('.bottom-tab').forEach(t => t.classList.remove('active'));
		document.getElementById('bottom-tab-' + tabName).classList.add('active');

		// Toggle bottom tab content
		document.querySelectorAll('.bottom-tab-content').forEach(c => c.classList.remove('active'));
		document.getElementById('bottom-content-' + tabName).classList.add('active');

		// Refresh navigator for the selected tab
		if (tabName === 'templates') refreshTemplateNav();
		if (tabName === 'attrsets') refreshAttrSetNav();
	}

	function evaluateXPath(xpath, context) {
		if (!xpath) return "";

		// Unwrap template context if needed (from call-template)
		// Template context is { _xmlContext: actualXmlContext, _params: {...} }
		let xmlContext = context;
		if (context && context._xmlContext) {
			xmlContext = context._xmlContext;
			// Recursively unwrap in case of nested template calls
			while (xmlContext && xmlContext._xmlContext) {
				xmlContext = xmlContext._xmlContext;
			}
		}

		let resolvedXPath = xpath;

		// --- Dynamic XSL 3.0 Map Shim ---
		// This regex captures the map name (group 1) and the key (group 2)
		// Matches: map:get($anyMapName, 'anyKey')
		const mapRegex = /map:get\(\$([^,\s]+),\s*['"]([^'"]+)['"]\)/g;

		if (resolvedXPath.includes("map:get")) {
			try {
				const mapData = JSON.parse(document.getElementById('mapInput').value || "{}");

				resolvedXPath = resolvedXPath.replace(mapRegex, (match, mapName, key) => {
					// Look for the specific map object in your JSON (e.g., mapData['firstMap'])
					const targetMap = mapData[mapName];
					const value = targetMap ? targetMap[key] : undefined;

					// Return as an XPath string literal
					return value !== undefined ? `'${value}'` : "''";
				});
			} catch(e) {
				console.warn("Map resolution failed: check if JAVA MAP JSON is valid.");
			}
		}

		try {
			const doc = xmlContext.ownerDocument || xmlContext;
			const res = doc.evaluate(resolvedXPath, xmlContext, null, XPathResult.STRING_TYPE, null);
			return res.stringValue;
		} catch(e) {
			console.error(`XPath Error on [${resolvedXPath}]:`, e);
			return "";
		}
	}

function renderPreview() {
		saveProject();
		console.log("--- Starting Render Process ---");
		
		// 1. Get the raw string and pre-process it immediately
		let xslStr = document.getElementById('xslInput').value;
		xslStr = preProcessXslt(xslStr); 
		
		const xmlStr = document.getElementById('xmlInput').value || "<r/>";
		const parser = new DOMParser();
		
		// 2. Now parse the "cleaned" string
		let xslDoc = parser.parseFromString(xslStr, "text/xml");
		const xmlDataDoc = parser.parseFromString(xmlStr, "text/xml");
		
		// ... rest of the function ...

		// 1. Resolve Includes (Stitching)
		const includes = xslDoc.getElementsByTagNameNS("*", "include");
		console.log(`Found ${includes.length} include tags in main XSL.`);
		
		for (let i = includes.length - 1; i >= 0; i--) {
			const href = includes[i].getAttribute('href');
			console.log(`Processing include: ${href}`);
			
			if (library[href]) {
				console.log(`  SUCCESS: ${href} found in Library.`);
				const sub = parser.parseFromString(library[href], "text/xml");
				const subTemplates = sub.getElementsByTagNameNS("*", "template");
				console.log(`  Moving ${subTemplates.length} templates from ${href} to main XSL.`);
				
				Array.from(subTemplates).forEach(t => {
					xslDoc.documentElement.appendChild(xslDoc.importNode(t, true));
				});
				includes[i].remove();
			} else {
				console.error(`  FAILURE: ${href} NOT found in Library. Available:`, Object.keys(library));
			}
		}

		// 2. Inject Java Map
		try {
			const mapData = JSON.parse(document.getElementById('mapInput').value || "{}");
			for (let [k, v] of Object.entries(mapData)) {
				let p = xslDoc.createElementNS("http://www.w3.org/1999/XSL/Transform", "xsl:param");
				p.setAttribute("name", k);
				p.textContent = v;
				xslDoc.documentElement.insertBefore(p, xslDoc.documentElement.firstChild);
			}
		} catch(e) { console.warn("Java Map JSON is invalid or empty."); }

		const canvas = document.getElementById('xsl-canvas');
		canvas.innerHTML = '';

		// Build the virtual map from the new textarea
		const imgLines = document.getElementById('imageMapInput').value.split('\n');
		virtualImages = {}; // Reset the global map before repopulating
		imgLines.forEach(line => {
			const [name, data] = line.split('|');
			if (name && data) virtualImages[name.trim()] = data.trim();
		});

		// 3. Extract static content (headers/footers) and page layout info
		const staticContents = {};
		const pageLayout = { bodyMargin: null };

		// Extract region-body margin from layout-master-set
		const layoutMasters = xslDoc.getElementsByTagNameNS("*", "simple-page-master");
		if (layoutMasters.length > 0) {
			const regionBody = layoutMasters[0].getElementsByTagNameNS("*", "region-body")[0];
			if (regionBody) {
				// Check for margin attribute (shorthand) or individual margins
				const margin = regionBody.getAttribute('margin');
				const marginTop = regionBody.getAttribute('margin-top');
				const marginRight = regionBody.getAttribute('margin-right');
				const marginBottom = regionBody.getAttribute('margin-bottom');
				const marginLeft = regionBody.getAttribute('margin-left');

				if (margin) {
					pageLayout.bodyMargin = margin;
				} else if (marginTop || marginRight || marginBottom || marginLeft) {
					pageLayout.bodyMargin = `${marginTop || '0'} ${marginRight || '0'} ${marginBottom || '0'} ${marginLeft || '0'}`;
				}
				console.log(`Region-body margin: ${pageLayout.bodyMargin}`);
			}
		}

		const pageSequences = xslDoc.getElementsByTagNameNS("*", "page-sequence");
		if (pageSequences.length > 0) {
			const pageSeq = pageSequences[0];

			// Extract inheritable font properties from page-sequence
			const inheritableProps = ['font-family', 'font-size', 'color', 'font-weight', 'font-style', 'line-height'];
			inheritableProps.forEach(prop => {
				const val = pageSeq.getAttribute(prop);
				if (val) {
					pageLayout[prop] = val;
					console.log(`Page-sequence ${prop}: ${val}`);
				}
			});

			const statics = pageSeq.getElementsByTagNameNS("*", "static-content");
			Array.from(statics).forEach(sc => {
				const flowName = sc.getAttribute('flow-name');
				if (flowName) {
					console.log(`Found static-content for: ${flowName}`);
					staticContents[flowName] = mapToHtml(sc, xmlDataDoc);
				}
			});
		}

		// 4. Start Context Fix
		// If the XSL uses "invoice/items", but the context is the Document, it works.
		// If it uses "/invoice/items", it needs the Document.
		// We pass the documentElement (the root tag) to start.
		const flows = xslDoc.getElementsByTagNameNS("*", "flow");
		const startNode = flows.length > 0 ? flows[0] : xslDoc.documentElement;

		console.log("Mapping FO to HTML...");
		// before: const result = mapToHtml(startNode, xmlDataDoc.documentElement);
		// after: This is the "Proper" way: Pass the whole document (Root Node)
		const result = mapToHtml(startNode, xmlDataDoc);
		canvas.appendChild(result);

		// Post-process: Split content into pages at page-break markers
		paginateCanvas(canvas, staticContents, pageLayout);

		// Post-process: Enable flex-based leaders if toggle is on
		if (document.getElementById('flexLeadersToggle')?.checked) {
			enableFlexLeaders(canvas);
		}

		// Update render timestamp
		const renderStatus = document.getElementById('render-status');
		if (renderStatus) {
			renderStatus.innerText = `Rendered: ${new Date().toLocaleTimeString()}`;
		}

		// Refresh template navigator
		refreshTemplateNav();

		console.log("--- Render Complete ---");
	}

	function createPageWithRegions(staticContents, pageLayout = {}) {
		const page = document.createElement('div');
		page.className = 'xsl-page';

		// Apply inheritable font properties from page-sequence
		if (pageLayout['font-family']) page.style.fontFamily = pageLayout['font-family'];
		if (pageLayout['font-size']) page.style.fontSize = pageLayout['font-size'];
		if (pageLayout['color']) page.style.color = pageLayout['color'];
		if (pageLayout['font-weight']) page.style.fontWeight = pageLayout['font-weight'];
		if (pageLayout['font-style']) page.style.fontStyle = pageLayout['font-style'];
		if (pageLayout['line-height']) page.style.lineHeight = pageLayout['line-height'];

		// Header (region-before)
		if (staticContents['xsl-region-before']) {
			const header = document.createElement('div');
			header.className = 'xsl-region-before';
			header.appendChild(staticContents['xsl-region-before'].cloneNode(true));
			page.appendChild(header);
		}

		// Body
		const body = document.createElement('div');
		body.className = 'xsl-region-body';
		body.contentEditable = 'true';
		// Apply dynamic margin/padding from fo:region-body
		if (pageLayout.bodyMargin) {
			body.style.padding = pageLayout.bodyMargin;
		}
		page.appendChild(body);

		// Footer (region-after)
		if (staticContents['xsl-region-after']) {
			const footer = document.createElement('div');
			footer.className = 'xsl-region-after';
			footer.appendChild(staticContents['xsl-region-after'].cloneNode(true));
			page.appendChild(footer);
		}

		return { page, body };
	}

	function paginateCanvas(canvas, staticContents = {}, pageLayout = {}) {
		// Collect all content from canvas into a temporary container
		const tempContainer = document.createElement('div');
		while (canvas.firstChild) {
			tempContainer.appendChild(canvas.firstChild);
		}

		// Find all page-break markers
		const markers = tempContainer.querySelectorAll('.page-break-marker');

		if (markers.length === 0) {
			// No page breaks - wrap all content in a single page with regions
			const { page, body } = createPageWithRegions(staticContents, pageLayout);
			while (tempContainer.firstChild) {
				body.appendChild(tempContainer.firstChild);
			}
			canvas.appendChild(page);
			updatePageNumbers(canvas);
			relocateAbsoluteElements(canvas);
			return;
		}

		// Split content at page-break markers
		let { page: currentPage, body: currentBody } = createPageWithRegions(staticContents, pageLayout);

		// Process all nodes, splitting at markers
		const allNodes = Array.from(tempContainer.childNodes);
		splitAtMarkers(allNodes, canvas, currentPage, currentBody, staticContents, pageLayout);
		updatePageNumbers(canvas);
		relocateAbsoluteElements(canvas);
	}

	function splitAtMarkers(nodes, canvas, currentPage, currentBody, staticContents, pageLayout = {}) {
		nodes.forEach(node => {
			if (node.classList && node.classList.contains('page-break-marker')) {
				// Found a page break - finalize current page and start a new one
				if (currentBody.childNodes.length > 0 || canvas.childNodes.length === 0) {
					canvas.appendChild(currentPage);
				}
				const newPage = createPageWithRegions(staticContents, pageLayout);
				currentPage = newPage.page;
				currentBody = newPage.body;
			} else if (node.nodeType === 1 && node.querySelector && node.querySelector('.page-break-marker')) {
				// This element contains page-break markers - need to split it
				const childNodes = Array.from(node.childNodes);
				// Clone the container for structure, but we'll populate it differently
				const wrapper = node.cloneNode(false);
				currentBody.appendChild(wrapper);

				childNodes.forEach(child => {
					if (child.classList && child.classList.contains('page-break-marker')) {
						// Page break inside container - close wrapper, close page, start new
						if (currentBody.childNodes.length > 0) {
							canvas.appendChild(currentPage);
						}
						const newPage = createPageWithRegions(staticContents, pageLayout);
						currentPage = newPage.page;
						currentBody = newPage.body;
						// Create new wrapper for continued content
						const newWrapper = node.cloneNode(false);
						currentBody.appendChild(newWrapper);
					} else if (child.nodeType === 1 && child.querySelector && child.querySelector('.page-break-marker')) {
						// Nested page breaks - recurse
						const nestedResult = splitAtMarkersNested(child, canvas, currentPage, currentBody, node, staticContents, pageLayout);
						currentPage = nestedResult.currentPage;
						currentBody = nestedResult.currentBody;
					} else {
						// Regular child - add to current wrapper
						const currentWrapper = currentBody.lastElementChild;
						if (currentWrapper && currentWrapper.tagName === node.tagName) {
							currentWrapper.appendChild(child);
						} else {
							currentBody.appendChild(child);
						}
					}
				});
			} else {
				// Regular node - add to current page body
				currentBody.appendChild(node);
			}
		});

		// Don't forget the last page
		if (currentBody.childNodes.length > 0) {
			canvas.appendChild(currentPage);
		}
	}

	function splitAtMarkersNested(node, canvas, currentPage, currentBody, parentTemplate, staticContents, pageLayout = {}) {
		const childNodes = Array.from(node.childNodes);
		const wrapper = node.cloneNode(false);
		const parentWrapper = currentBody.lastElementChild;
		if (parentWrapper) {
			parentWrapper.appendChild(wrapper);
		} else {
			currentBody.appendChild(wrapper);
		}

		childNodes.forEach(child => {
			if (child.classList && child.classList.contains('page-break-marker')) {
				canvas.appendChild(currentPage);
				const newPage = createPageWithRegions(staticContents, pageLayout);
				currentPage = newPage.page;
				currentBody = newPage.body;
				// Recreate parent structure
				const newParentWrapper = parentTemplate.cloneNode(false);
				const newWrapper = node.cloneNode(false);
				newParentWrapper.appendChild(newWrapper);
				currentBody.appendChild(newParentWrapper);
			} else {
				const currentWrapper = currentBody.querySelector(node.tagName + ':last-of-type') || currentBody.lastElementChild;
				if (currentWrapper) {
					currentWrapper.appendChild(child);
				}
			}
		});

		return { currentPage, currentBody };
	}

	function updatePageNumbers(canvas) {
		const pages = canvas.querySelectorAll('.xsl-page');
		const totalPages = pages.length;

		pages.forEach((page, index) => {
			page.querySelectorAll('.fo-page-number').forEach(el => {
				el.textContent = index + 1;
			});
			page.querySelectorAll('.fo-page-number-citation-last').forEach(el => {
				el.textContent = totalPages;
			});
		});
	}

	function enableFlexLeaders(canvas) {
		// Find all fill-mode leaders and convert their parent blocks to flex containers
		canvas.querySelectorAll('.fo-leader-fill').forEach(leader => {
			const parent = leader.parentElement;
			if (parent && parent.style.display !== 'flex') {
				parent.style.display = 'flex';
				parent.style.alignItems = 'baseline';
				// Ensure text nodes before/after leader are wrapped for proper flex behavior
				// (Browser should handle this, but explicit wrapping can help)
			}
		});
	}

	function relocateAbsoluteElements(canvas) {
		// Move absolutely positioned elements from region-before/after to page level
		// This allows watermarks and overlays defined in static-content to position
		// relative to the page, matching real XSL-FO engine behavior
		canvas.querySelectorAll('.xsl-page').forEach(page => {
			const regions = page.querySelectorAll('.xsl-region-before, .xsl-region-after');
			regions.forEach(region => {
				// Find all direct and nested elements with position: absolute
				region.querySelectorAll('*').forEach(el => {
					if (getComputedStyle(el).position === 'absolute') {
						// Move to page level so it positions relative to .xsl-page
						page.appendChild(el);
					}
				});
			});
		});
	}

	// ===== SNIPPET INSERTION HELPERS =====

	const SNIPPETS = {
		'block': '<fo:block>\n    \n</fo:block>',
		'inline': '<fo:inline></fo:inline>',
		'inline-container': '<fo:inline-container>\n    <fo:block>\n        \n    </fo:block>\n</fo:inline-container>',
		'leader': '<fo:leader leader-pattern="dots"/>',
		'graphic': '<fo:external-graphic src="" content-width="50pt"/>',
		'template': '<xsl:template name="templateName">\n    \n</xsl:template>',
		'call-template': '<xsl:call-template name=""/>',
		'for-each': '<xsl:for-each select="">\n    \n</xsl:for-each>',
		'if': '<xsl:if test="">\n    \n</xsl:if>',
		'choose': '<xsl:choose>\n    <xsl:when test="">\n        \n    </xsl:when>\n    <xsl:otherwise>\n        \n    </xsl:otherwise>\n</xsl:choose>',
		'value-of': '<xsl:value-of select=""/>'
	};

	function insertSnippet(type) {
		// Check if help mode is enabled
		const helpMode = document.getElementById('helpModeToggle')?.checked ?? true;

		// Show help dialogs for supported elements when help mode is on
		if (helpMode) {
			if (type === 'block') {
				showBlockHelpDialog();
				return;
			}
			// Add more help dialogs here as needed
		}

		// Default: insert basic snippet
		const textarea = document.getElementById('xslInput');
		const snippet = SNIPPETS[type];
		if (snippet) {
			insertAtCursor(textarea, snippet);
		}
	}

	function insertAtCursor(textarea, text) {
		const start = textarea.selectionStart;
		const end = textarea.selectionEnd;
		const value = textarea.value;

		textarea.value = value.substring(0, start) + text + value.substring(end);

		// Position cursor inside the inserted snippet (after first newline or at a sensible position)
		let cursorPos = start + text.length;
		const firstNewline = text.indexOf('\n');
		if (firstNewline !== -1) {
			// Position after the indentation on the next line
			cursorPos = start + firstNewline + 5; // Account for newline + typical indentation
		} else {
			// For single-line snippets, try to position at empty attribute value
			const emptyQuotes = text.indexOf('""');
			if (emptyQuotes !== -1) {
				cursorPos = start + emptyQuotes + 1;
			}
		}

		textarea.selectionStart = textarea.selectionEnd = cursorPos;
		textarea.focus();
		saveProject();
	}

	function generateTableXsl() {
		const cols = parseInt(document.getElementById('table-cols').value) || 2;
		const rows = parseInt(document.getElementById('table-rows').value) || 2;
		const hasHeader = document.getElementById('table-header').checked;
		const hasBorders = document.getElementById('table-borders').checked;
		const tableAttrSet = document.getElementById('table-attr-set').value.trim();
		const cellAttrSet = document.getElementById('table-cell-attr-set').value.trim();

		// Check if attribute sets exist and offer to create them
		const missingAttrSets = [];
		if (tableAttrSet && !attrSetExists(tableAttrSet)) {
			missingAttrSets.push({ name: tableAttrSet, type: 'table' });
		}
		if (cellAttrSet && !attrSetExists(cellAttrSet)) {
			missingAttrSets.push({ name: cellAttrSet, type: 'cell' });
		}

		if (missingAttrSets.length > 0) {
			const names = missingAttrSets.map(a => a.name).join(', ');
			const create = confirm(
				`The following attribute set(s) do not exist:\n${names}\n\n` +
				`Would you like to create them with default presets?\n` +
				`(You can edit them later in the ATTRIBUTE SETS tab)`
			);
			if (create) {
				// Auto-create each missing attribute set with its preset
				missingAttrSets.forEach(attrSet => {
					createAttrSetWithPreset(attrSet.name, attrSet.type);
				});
				refreshAttrSetNav();
			}
		}

		const colWidth = `${Math.floor(100 / cols)}%`;

		// Build table opening tag
		let tableAttrs = 'table-layout="fixed" width="100%"';
		if (tableAttrSet) {
			tableAttrs = `xsl:use-attribute-sets="${tableAttrSet}" ${tableAttrs}`;
		}
		let xsl = `<fo:table ${tableAttrs}>\n`;

		// Column definitions
		for (let c = 0; c < cols; c++) {
			xsl += `    <fo:table-column column-width="${colWidth}"/>\n`;
		}

		// Build cell attributes
		let cellAttrs = '';
		if (cellAttrSet) {
			cellAttrs = ` xsl:use-attribute-sets="${cellAttrSet}"`;
		} else if (hasBorders) {
			cellAttrs = ' border="1pt solid black" padding="2pt"';
		} else {
			cellAttrs = ' padding="2pt"';
		}

		// Header
		if (hasHeader) {
			xsl += '    <fo:table-header>\n';
			xsl += '        <fo:table-row>\n';
			for (let c = 0; c < cols; c++) {
				xsl += `            <fo:table-cell${cellAttrs}>\n`;
				xsl += `                <fo:block font-weight="bold">Header ${c + 1}</fo:block>\n`;
				xsl += '            </fo:table-cell>\n';
			}
			xsl += '        </fo:table-row>\n';
			xsl += '    </fo:table-header>\n';
		}

		// Body
		xsl += '    <fo:table-body>\n';
		for (let r = 0; r < rows; r++) {
			xsl += '        <fo:table-row>\n';
			for (let c = 0; c < cols; c++) {
				xsl += `            <fo:table-cell${cellAttrs}>\n`;
				xsl += `                <fo:block>Cell ${r + 1}-${c + 1}</fo:block>\n`;
				xsl += '            </fo:table-cell>\n';
			}
			xsl += '        </fo:table-row>\n';
		}
		xsl += '    </fo:table-body>\n';
		xsl += '</fo:table>';

		const textarea = document.getElementById('xslInput');
		insertAtCursor(textarea, xsl);
		closeTableDialog();
	}

	function insertComment() {
		const text = document.getElementById('comment-text').value.trim();
		if (!text) {

	function updateAttrSetPreview() {

	function attrSetExists(name) {

	function createAttrSetWithPreset(name, type) {
		const preset = ATTRSET_PRESETS[type];
		if (!preset) return;

		// Build attribute set with checked (default) attributes from preset
		let attrSetXsl = `<xsl:attribute-set name="${name}">\n`;
		preset.attributes.filter(a => a.checked).forEach(attr => {
			attrSetXsl += `    <xsl:attribute name="${attr.name}">${attr.value}</xsl:attribute>\n`;
		});
		attrSetXsl += '</xsl:attribute-set>\n\n';

		// Insert at a good location - after stylesheet opening or after existing attribute-sets
		const textarea = document.getElementById('xslInput');
		let xsl = textarea.value;

		// Try to find existing attribute-sets and insert after the last one
		const lastAttrSetMatch = xsl.match(/<\/xsl:attribute-set>\s*/g);
		if (lastAttrSetMatch) {
			const lastIndex = xsl.lastIndexOf('</xsl:attribute-set>');
			const insertPos = lastIndex + '</xsl:attribute-set>'.length;
			// Find end of line
			let endOfLine = xsl.indexOf('\n', insertPos);
			if (endOfLine === -1) endOfLine = insertPos;
			xsl = xsl.slice(0, endOfLine + 1) + '\n' + attrSetXsl + xsl.slice(endOfLine + 1);
		} else {
			// No existing attribute-sets, insert after stylesheet declaration
			const stylesheetMatch = xsl.match(/<xsl:stylesheet[^>]*>/);
			if (stylesheetMatch) {
				const insertPos = stylesheetMatch.index + stylesheetMatch[0].length;
				let endOfLine = xsl.indexOf('\n', insertPos);
				if (endOfLine === -1) endOfLine = insertPos;
				xsl = xsl.slice(0, endOfLine + 1) + '\n' + attrSetXsl + xsl.slice(endOfLine + 1);
			} else {
				// Fallback: insert at cursor
				insertAtCursor(textarea, attrSetXsl);
				return;
			}
		}

		textarea.value = xsl;
		saveProject();
	}

	function closeCallTemplateDialog() {
		const overlay = document.getElementById('call-template-dialog-overlay');
		if (overlay) overlay.remove();
	}

	function insertCallTemplateFromDialog() {
		const callType = document.querySelector('input[name="call-type"]:checked')?.value;
		let templateName = '';

		if (callType === 'current') {
			templateName = activeTemplate;
		} else {
			templateName = document.getElementById('call-template-name-input').value.trim();
		}

		if (!templateName) {
			const input = document.getElementById('call-template-name-input');
			input.style.borderColor = '#c62828';
			input.focus();
			return;
		}

		// Try to extract params from the template
		const params = extractTemplateParams(templateName);

		let callXsl;
		if (params.length > 0) {
			// Generate call with with-param elements
			callXsl = `<xsl:call-template name="${templateName}">\n`;
			params.forEach(param => {
				callXsl += `    <xsl:with-param name="${param.name}" select=""/>`;
				if (param.defaultValue) {
					callXsl += ` <!-- default: ${param.defaultValue} -->`;
				}
				callXsl += '\n';
			});
			callXsl += '</xsl:call-template>';
		} else {
			callXsl = `<xsl:call-template name="${templateName}"/>`;
		}

		const textarea = document.getElementById('xslInput');
		insertAtCursor(textarea, callXsl);

		closeCallTemplateDialog();
	}

	function extractTemplateParams(templateName) {
		// First check if we have it in our templates storage
		let templateContent = templates[templateName];

		// If not in storage, try to extract from main XSL
		if (!templateContent) {
			templateContent = extractTemplateFromXsl(templateName);
		}

		if (!templateContent) return [];

		// Find all xsl:param elements in the template
		const params = [];
		const paramRegex = /<xsl:param\s+name="([^"]+)"(?:\s+select="([^"]*)")?[^>]*\/?>/g;

		let match;
		while ((match = paramRegex.exec(templateContent)) !== null) {
			params.push({
				name: match[1],
				defaultValue: match[2] || null
			});
		}

		return params;
	}

	// ===== TEMPLATE EDITOR FUNCTIONS =====

	function extractTemplateFromXsl(templateName) {
		const xsl = document.getElementById('xslInput').value;
		// Find the template start
		const startRegex = new RegExp(`<xsl:template\\s+name="${templateName}"[^>]*>`, 'g');
		const startMatch = startRegex.exec(xsl);
		if (!startMatch) return null;

		const startIndex = startMatch.index;
		let depth = 1;
		let pos = startIndex + startMatch[0].length;

		// Find matching closing tag by counting depth
		while (depth > 0 && pos < xsl.length) {
			const openMatch = xsl.substring(pos).match(/^<xsl:template[\s>]/);
			const closeMatch = xsl.substring(pos).match(/^<\/xsl:template>/);

			if (closeMatch) {
				depth--;
				if (depth === 0) {
					return xsl.substring(startIndex, pos + closeMatch[0].length);
				}
				pos += closeMatch[0].length;
			} else if (openMatch) {
				depth++;
				pos++;
			} else {
				pos++;
			}
		}
		return null;
	}

	function loadTemplateToEditor(templateName) {
		if (!templateName) {
			// Clear editor
			hideTemplateEditor();
			activeTemplate = null;
			saveProject();
			return;
		}

		// Check if we already have this template stored
		if (!templates[templateName]) {
			// Extract from main XSL
			const extracted = extractTemplateFromXsl(templateName);
			if (!extracted) {
				alert(`Could not find template "${templateName}" in the main XSL.`);
				return;
			}
			templates[templateName] = extracted;
		}

		activeTemplate = templateName;
		showTemplateEditor(templateName, templates[templateName]);
		saveProject();
	}

	function updateTemplateEditorStatus() {
		if (!activeTemplate) return;

		const statusEl = document.getElementById('template-editor-status');
		const currentInXsl = extractTemplateFromXsl(activeTemplate);
		const stored = templates[activeTemplate];

		if (!currentInXsl) {
			statusEl.textContent = '⚠ Not in XSL';
			statusEl.className = 'template-status modified';
		} else if (currentInXsl !== stored) {
			statusEl.textContent = '● Modified';
			statusEl.className = 'template-status modified';
		} else {
			statusEl.textContent = '✓ Synced';
			statusEl.className = 'template-status';
		}
	}

	function discardTemplateChanges() {
		if (!activeTemplate) return;

		const currentInXsl = extractTemplateFromXsl(activeTemplate);
		if (currentInXsl) {
			templates[activeTemplate] = currentInXsl;
			document.getElementById('templateEditorInput').value = currentInXsl;
			updateTemplateEditorStatus();
			saveProject();
		} else {
			if (confirm(`Template "${activeTemplate}" not found in main XSL. Remove from editor?`)) {
				delete templates[activeTemplate];
				activeTemplate = null;
				hideTemplateEditor();
				refreshTemplateNav();
				saveProject();
			}
		}
	}

	function updateTemplateInXsl() {
		if (!activeTemplate) return;

		const xsl = document.getElementById('xslInput').value;
		const newContent = templates[activeTemplate];

		// Find the original template in XSL
		const currentInXsl = extractTemplateFromXsl(activeTemplate);

		if (!currentInXsl) {
			// Template not found - show helpful error
			alert(
				`Template "${activeTemplate}" was not found in the main XSL.\n\n` +
				`To re-establish it:\n` +
				`1. Copy the template content from the editor below\n` +
				`2. Paste it into the main XSL at the desired location\n` +
				`3. Click "Discard" to sync the editor with the main XSL`
			);
			return;
		}

		// Replace the old template with the new content
		const newXsl = xsl.replace(currentInXsl, newContent);
		document.getElementById('xslInput').value = newXsl;

		updateTemplateEditorStatus();
		saveProject();

		// Visual feedback
		const btn = event.target;
		const originalText = btn.textContent;
		btn.textContent = '✓ Updated!';
		btn.style.background = '#43a047';
		setTimeout(() => {
			btn.textContent = originalText;
			btn.style.background = '';
		}, 1500);
	}

	function extractAttrSetFromXsl(attrSetName) {

		const startRegex = new RegExp(`<xsl:attribute-set\\s+name="${attrSetName}"[^>]*>`, 'g');
		const startMatch = startRegex.exec(xsl);
		if (!startMatch) return null;

		const startIndex = startMatch.index;

		let pos = startIndex + startMatch[0].length;

		while (depth > 0 && pos < xsl.length) {

			const closeMatch = xsl.substring(pos).match(/^<\/xsl:attribute-set>/);

				}
				pos += closeMatch[0].length;
			} else if (openMatch) {
				depth++;
				pos++;
