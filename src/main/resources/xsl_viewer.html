<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XSL-FO Professional Sandbox v6</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --bg: #525659; --panel-bg: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: var(--primary); color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        main { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 450px; display: flex; flex-direction: column; border-right: 2px solid #333; background: #252526; color: #ccc; }
        .tabs { display: flex; background: #333; }
        .tab { flex: 1; padding: 10px; cursor: pointer; text-align: center; font-size: 0.75rem; border-bottom: 2px solid transparent; }
        .tab.active { background: var(--panel-bg); color: white; border-bottom: 2px solid var(--accent); }
        textarea { flex: 1; font-family: 'Fira Code', monospace; font-size: 12px; padding: 15px; border: none; outline: none; background: var(--panel-bg); color: #d4d4d4; resize: none; }
        #library-list { padding: 10px; background: #2d2d2d; border-top: 1px solid #444; max-height: 150px; overflow-y: auto; }
        .lib-item { font-size: 0.7rem; display: flex; justify-content: space-between; padding: 6px; border-bottom: 1px solid #3d3d3d; align-items: center; }
        #preview-zone { flex: 1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; background: var(--bg); }
        #xsl-canvas { background: white; width: 210mm; min-height: 297mm; padding: 20mm; box-shadow: 0 10px 30px rgba(0,0,0,0.5); outline: none; color: black; }
        button { cursor: pointer; border: none; border-radius: 4px; padding: 6px 12px; font-weight: 600; }
        .btn-primary { background: var(--accent); color: white; }
        .status-msg { font-size: 0.7rem; color: #aaa; margin-right: 15px; }
    </style>
</head>
<body onload="initProject()">

<header>
    <div><strong>XSL-FO Designer</strong> <small>| v6 Master Baseline</small></div>
    <div>
        <span id="save-status" class="status-msg"></span>
        <button class="btn-primary" onclick="renderPreview()">Render Preview & Save</button>
        <button onclick="clearProject()" style="background:#c0392b; color:white; margin-left:10px;">Reset Project</button>
    </div>
</header>

<main>
	<div class="sidebar">
		<div class="tabs">
			<div id="tab-xsl" class="tab active" onclick="showTab('xsl')">XSLT</div>
			<div id="tab-xml" class="tab" onclick="showTab('xml')">XML DATA</div>
			<div id="tab-map" class="tab" onclick="showTab('map')">JAVA MAP</div>
			<div id="tab-img" class="tab" onclick="showTab('img')">IMAGES</div>
		</div>
		
		<textarea id="xslInput" oninput="saveProject()" placeholder="Paste Main XSLT..."></textarea>
		<textarea id="xmlInput" style="display:none;" oninput="saveProject()" placeholder="Paste XML Data..."></textarea>
		<textarea id="mapInput" style="display:none;" oninput="saveProject()" placeholder='{ "reportTitle": "Invoice" }'></textarea>
		<textarea id="imageMapInput" style="display:none;" oninput="saveProject()" placeholder="logo.png|data:image/png;base64,..."></textarea>

		 <div style="padding: 5px 10px; background: #333; font-size: 0.7rem; font-weight: bold;">INCLUDE LIBRARY</div>
        <div id="library-list"></div>
        <div style="padding: 10px; display: flex; gap: 5px; background: #252526;">
            <input type="text" id="lib-name" placeholder="filename.xsl" style="flex:1; font-size:0.7rem; background:#333; color:white; border:1px solid #444; padding:4px;">
            <button onclick="addLibFile()" style="font-size:0.7rem;">Add File</button>
        </div>
		
		<div style="padding: 10px; background: #252526; border-top: 1px solid #444;">
			<button onclick="copyXsltToClipboard()" style="width: 100%; background: #007acc; color: white; border: none; padding: 8px; cursor: pointer; font-weight: bold;">
				COPY XSLT TO CLIPBOARD
			</button>
		</div>
		
    </div>
	
    <div id="preview-zone">
        <div id="xsl-canvas" contenteditable="true"></div>
    </div>
</main>

<script>
	// Global scope
    let library = {};
	let virtualImages = {}; 
    const MISSING_IMAGE_SVG = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjZGVkZWRlIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtc2l6ZT0iOCIgZmlsbD0iI2FhYSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+TUlTU0lORzwvdGV4dD48L3N2Zz4=";
	const XSLT_SHIMS = {
		// Add pairs here: "Original String": "Replacement String"
		"fo:multi-switch": "fo:block", 
		"fo:multi-case": "fo:block",
		"proprietary:custom-extension": "fo:inline",
		"xsl:analyze-string": "xsl:comment", // Kill complex logic for now

		// Layout tags that browsers don't understand
		"fo:declarations": "xsl:comment",
		"fo:bookmark-tree": "xsl:comment",
		"fo:destination": "xsl:comment",
		
		// Proprietary extensions (common in FOP or XEP)
		"fox:external-document": "fo:block",
		"rx:meta-field": "xsl:comment",
		
		// XSL 2.0+ logic that can break 1.0 parsers if not handled
		"xsl:result-document": "xsl:comment",
		"xsl:character-map": "xsl:comment",
	};

	function initProject() {
        const saved = localStorage.getItem('xslfo_sandbox_v6');
        if (saved) {
            const data = JSON.parse(saved);
            
            // 1. Populate Textareas
            document.getElementById('xslInput').value = data.xsl || '';
            document.getElementById('xmlInput').value = data.xml || '';
            document.getElementById('mapInput').value = data.map || '';
            
            // 2. Load the new Images Tab content
            document.getElementById('imageMapInput').value = data.img || '';
            
            // 3. Re-hydrate the Library object
            library = data.library || {};
            
            renderLibUI();
            
            // 4. Initial Render
            if (data.xsl) renderPreview();
        }
    }

    function saveProject() {
        const data = {
            xsl: document.getElementById('xslInput').value,
            xml: document.getElementById('xmlInput').value,
            map: document.getElementById('mapInput').value,
            img: document.getElementById('imageMapInput').value, // Save Images
            library: library
        };
        localStorage.setItem('xslfo_sandbox_v6', JSON.stringify(data));
        
        // Visual feedback in the header
        const status = document.getElementById('save-status');
        if (status) {
            status.innerText = `Auto-saved: ${new Date().toLocaleTimeString()}`;
        }
    }
	
    function clearProject() {
        if (confirm("Reset everything?")) { localStorage.removeItem('xslfo_sandbox_v6'); location.reload(); }
    }

	async function copyXsltToClipboard() {
		const xslContent = document.getElementById('xslInput').value;
		try {
			await navigator.clipboard.writeText(xslContent);
			// Visual feedback
			const btn = event.target;
			const originalText = btn.innerText;
			btn.innerText = "✓ COPIED!";
			btn.style.background = "#28a745";
			setTimeout(() => {
				btn.innerText = originalText;
				btn.style.background = "#007acc";
			}, 2000);
		} catch (err) {
			console.error('Failed to copy: ', err);
		}
	}

	function preProcessXslt(rawStr) {
		let processed = rawStr;
		
		// Apply the static shims
		for (const [target, replacement] of Object.entries(XSLT_SHIMS)) {
			// Use a global regex to replace all instances
			const escapedTarget = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
			const re = new RegExp(escapedTarget, 'g');
			processed = processed.replace(re, replacement);
		}
		
		return processed;
	}

	function showTab(tabName) {
		// 1. Update tab styling
		document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
		document.getElementById('tab-' + tabName).classList.add('active');

		// 2. Toggle textareas
		document.getElementById('xslInput').style.display = (tabName === 'xsl' ? 'block' : 'none');
		document.getElementById('xmlInput').style.display = (tabName === 'xml' ? 'block' : 'none');
		document.getElementById('mapInput').style.display = (tabName === 'map' ? 'block' : 'none');
		document.getElementById('imageMapInput').style.display = (tabName === 'img' ? 'block' : 'none');
	}

    function addLibFile() {
        const name = document.getElementById('lib-name').value;
        const content = prompt(`Paste XSL for ${name}`);
        if (name && content) { library[name] = content; renderLibUI(); saveProject(); }
    }

    function renderLibUI() {
        const list = document.getElementById('library-list');
        list.innerHTML = Object.keys(library).map(name => `
            <div class="lib-item">
                <span>📄 ${name}</span>
                <button onclick="delete library['${name}']; renderLibUI(); saveProject();" style="background:none; color:red; cursor:pointer;">&times;</button>
            </div>`).join('');
    }

	function evaluateXPath(xpath, context) {
		if (!xpath) return "";
		
		let resolvedXPath = xpath;

		// --- Dynamic XSL 3.0 Map Shim ---
		// This regex captures the map name (group 1) and the key (group 2)
		// Matches: map:get($anyMapName, 'anyKey')
		const mapRegex = /map:get\(\$([^,\s]+),\s*['"]([^'"]+)['"]\)/g;
		
		if (resolvedXPath.includes("map:get")) {
			try {
				const mapData = JSON.parse(document.getElementById('mapInput').value || "{}");
				
				resolvedXPath = resolvedXPath.replace(mapRegex, (match, mapName, key) => {
					// Look for the specific map object in your JSON (e.g., mapData['firstMap'])
					const targetMap = mapData[mapName];
					const value = targetMap ? targetMap[key] : undefined;
					
					// Return as an XPath string literal
					return value !== undefined ? `'${value}'` : "''";
				});
			} catch(e) {
				console.warn("Map resolution failed: check if JAVA MAP JSON is valid.");
			}
		}

		try {
			const doc = context.ownerDocument || context;
			const res = doc.evaluate(resolvedXPath, context, null, XPathResult.STRING_TYPE, null);
			return res.stringValue;
		} catch(e) { 
			console.error(`XPath Error on [${resolvedXPath}]:`, e);
			return ""; 
		}
	}

function renderPreview() {
		saveProject();
		console.log("--- Starting Render Process ---");
		
		// 1. Get the raw string and pre-process it immediately
		let xslStr = document.getElementById('xslInput').value;
		xslStr = preProcessXslt(xslStr); 
		
		const xmlStr = document.getElementById('xmlInput').value || "<r/>";
		const parser = new DOMParser();
		
		// 2. Now parse the "cleaned" string
		let xslDoc = parser.parseFromString(xslStr, "text/xml");
		const xmlDataDoc = parser.parseFromString(xmlStr, "text/xml");
		
		// ... rest of the function ...

		// 1. Resolve Includes (Stitching)
		const includes = xslDoc.getElementsByTagNameNS("*", "include");
		console.log(`Found ${includes.length} include tags in main XSL.`);
		
		for (let i = includes.length - 1; i >= 0; i--) {
			const href = includes[i].getAttribute('href');
			console.log(`Processing include: ${href}`);
			
			if (library[href]) {
				console.log(`  SUCCESS: ${href} found in Library.`);
				const sub = parser.parseFromString(library[href], "text/xml");
				const subTemplates = sub.getElementsByTagNameNS("*", "template");
				console.log(`  Moving ${subTemplates.length} templates from ${href} to main XSL.`);
				
				Array.from(subTemplates).forEach(t => {
					xslDoc.documentElement.appendChild(xslDoc.importNode(t, true));
				});
				includes[i].remove();
			} else {
				console.error(`  FAILURE: ${href} NOT found in Library. Available:`, Object.keys(library));
			}
		}

		// 2. Inject Java Map
		try {
			const mapData = JSON.parse(document.getElementById('mapInput').value || "{}");
			for (let [k, v] of Object.entries(mapData)) {
				let p = xslDoc.createElementNS("http://www.w3.org/1999/XSL/Transform", "xsl:param");
				p.setAttribute("name", k);
				p.textContent = v;
				xslDoc.documentElement.insertBefore(p, xslDoc.documentElement.firstChild);
			}
		} catch(e) { console.warn("Java Map JSON is invalid or empty."); }

		const canvas = document.getElementById('xsl-canvas');
		canvas.innerHTML = '';
		
		// 3. Start Context Fix
		// If the XSL uses "invoice/items", but the context is the Document, it works.
		// If it uses "/invoice/items", it needs the Document. 
		// We pass the documentElement (the root tag) to start.
		const flows = xslDoc.getElementsByTagNameNS("*", "flow");
		const startNode = flows.length > 0 ? flows[0] : xslDoc.documentElement;
		


		
		// Build the virtual map from the new textarea
		const imgLines = document.getElementById('imageMapInput').value.split('\n');
		virtualImages = {}; // Reset the global map before repopulating
		imgLines.forEach(line => {
			const [name, data] = line.split('|');
			if (name && data) virtualImages[name.trim()] = data.trim();
		});				
		
		
		console.log("Mapping FO to HTML...");
		// before: const result = mapToHtml(startNode, xmlDataDoc.documentElement); 
		// after: This is the "Proper" way: Pass the whole document (Root Node)
		const result = mapToHtml(startNode, xmlDataDoc);
		canvas.appendChild(result);
		console.log("--- Render Complete ---");
	}

function mapToHtml(xmlNode, dataContext) {
    // Handle text nodes
    if (xmlNode.nodeType === 3) return document.createTextNode(xmlNode.textContent);

    const ln = xmlNode.localName;
    const ns = xmlNode.namespaceURI;
    const isXSL = ns?.includes("Transform");

    // --- XSL LOGIC ---
    if (isXSL) {
        if (ln === "value-of") {
            const val = evaluateXPath(xmlNode.getAttribute('select'), dataContext);
            const span = document.createElement('span');
            span.style.color = '#2980b9';
            span.innerText = val;
            return span;
        }

        if (ln === "for-each") {
            const frag = document.createDocumentFragment();
            const nodes = (dataContext.ownerDocument || dataContext).evaluate(xmlNode.getAttribute('select'), dataContext, null, 7, null);
            for (let i = 0; i < nodes.snapshotLength; i++) {
                Array.from(xmlNode.childNodes).forEach(c => {
                    const res = mapToHtml(c, nodes.snapshotItem(i));
                    if (res instanceof Node) frag.appendChild(res);
                });
            }
            return frag;
        }

        if (ln === "call-template") {
            const name = xmlNode.getAttribute('name');
            const templates = xmlNode.ownerDocument.getElementsByTagNameNS("*", "template");
            let def = null;
            for (let t of templates) {
                if (t.getAttribute('name') === name) {
                    def = t;
                    break;
                }
            }
            if (def) {
                const frag = document.createDocumentFragment();
                Array.from(def.childNodes).forEach(c => {
                    const res = mapToHtml(c, dataContext);
                    if (res instanceof Node) frag.appendChild(res);
                });
                return frag;
            } else {
                const err = document.createElement('span');
                err.style.color = 'red';
                err.innerText = `[Template "${name}" Not Found]`;
                return err;
            }
        }

        if (ln === "attribute") {
            const attrName = xmlNode.getAttribute('name');
            let attrValue = "";
			Array.from(xmlNode.childNodes).forEach(c => {
				// Use a more robust check that handles potential prefixes or lack of localName
				const nodeName = c.localName || c.nodeName.split(':').pop();
				
				if (nodeName === "value-of") {
					attrValue += evaluateXPath(c.getAttribute('select'), dataContext);
				} else if (c.nodeType === 3) {
					attrValue += c.textContent;
				}
			});
	
			// --- ADD THE TRIM HERE ---
			attrValue = attrValue.trim();
	
            if (attrName === 'src') {
                attrValue = attrValue.replace(/^url\(['"]?/, '').replace(/['"]?\)$/, '');
                //attrValue = virtualImages[attrValue] || library[attrValue] || attrValue;
                
				// new 2/5				

				// ... inside external-graphic and xsl:attribute 'src' logic ...
				let resolvedSrc = virtualImages[attrValue] || library[attrValue] || attrValue;

				// If the result is empty, or the lookup failed to find a real URL/Base64
				if (!resolvedSrc || resolvedSrc.trim() === "") {
					attrValue = MISSING_IMAGE_SVG;
				}
                
				// new 2/5				

                
				console.log("Resolved Image Path:", attrValue);
            }
            return { type: 'attribute', name: attrName, value: attrValue };
        }

        // Default XSL container (like xsl:if, xsl:choose)
        const frag = document.createDocumentFragment();
        Array.from(xmlNode.childNodes).forEach(c => {
            const childResult = mapToHtml(c, dataContext);
            if (childResult instanceof Node) frag.appendChild(childResult);
        });
        return frag;
    }

    // --- FO LAYOUT ---
    const tagMap = {
        'table': 'table',
        'table-header': 'thead',
        'table-body': 'tbody',
        'table-footer': 'tfoot',
        'table-row': 'tr',
        'table-cell': 'td',
        'leader': 'span',
        'page-number': 'span',
        'external-graphic': 'img'
    };
    
    const el = document.createElement(tagMap[ln] || 'div');

    if (ns?.includes("Format")) {
        const styles = {
            'font-size': 'fontSize',
            'font-weight': 'fontWeight',
            'text-align': 'textAlign',
            'border': 'border',
            'padding': 'padding',
            'width': 'width',
            'color': 'color',
            'background-color': 'backgroundColor',
            'space-after': 'marginBottom',
            'space-before': 'marginTop'
        };
        for (let [foAttr, jsProp] of Object.entries(styles)) {
            const val = xmlNode.getAttribute(foAttr);
            if (val) el.style[jsProp] = val;
        }
        
        if (ln === 'table') { 
            el.style.width = "100%"; 
            el.style.borderCollapse = "collapse"; 
        }

        if (ln === 'external-graphic') {
            let src = xmlNode.getAttribute('src') || "";
            src = src.replace(/^url\(['"]?/, '').replace(/['"]?\)$/, '');
            el.src = virtualImages[src] || library[src] || src;


            const width = xmlNode.getAttribute('content-width');
            const height = xmlNode.getAttribute('content-height');
            if (width) el.style.width = width;
            if (height) el.style.height = height;
            
            el.style.display = 'inline-block';
            el.alt = "XSL-FO Graphic";
            el.style.maxWidth = '100%';
        }

        if (ln === 'page-number') {
            el.innerText = "1";
            el.style.display = 'inline-block';
            el.style.minWidth = '1ch';
            el.style.backgroundColor = '#f1f1f1';
            el.style.padding = '0 2px';
            el.style.borderRadius = '2px';
        }

        if (ln === 'leader') {
            const len = xmlNode.getAttribute('leader-length');
            const pattern = xmlNode.getAttribute('leader-pattern') || 'space';
            const thickness = xmlNode.getAttribute('rule-thickness') || '1pt';
            el.style.display = 'inline-block';
            el.style.verticalAlign = 'baseline';
            if (len) {
                el.style.width = len;
            } else {
                el.style.width = '100%';
                el.style.minWidth = '10px';
            }
            if (pattern === 'dots') el.style.borderBottom = `${thickness} dotted currentColor`;
            else if (pattern === 'rule') el.style.borderBottom = `${thickness} solid currentColor`;
            
            const leaderColor = xmlNode.getAttribute('color');
            if (leaderColor) el.style.borderColor = leaderColor;
        }
    }

    // Recursively process children for FO Elements
    Array.from(xmlNode.childNodes).forEach(c => {
        const childResult = mapToHtml(c, dataContext);
        
        if (childResult && childResult.type === 'attribute') {
            // Apply the dynamic attribute to the current FO element 'el'
            if (childResult.name === 'src' && el.tagName === 'IMG') {
                el.src = childResult.value;
            } else {
                el.setAttribute(childResult.name, childResult.value);
            }
        } else if (childResult instanceof Node) {
            el.appendChild(childResult);
        }
    });

    return el;
}
</script>
</body>
</html>
