	}

	function onAttrSetEditorChange() {
		if (!activeAttrSet) return;
		attrSets[activeAttrSet] = document.getElementById('attrSetEditorInput').value;
		updateAttrSetEditorStatus();
		saveProject();
	}

	function updateAttrSetEditorStatus() {
		if (!activeAttrSet) return;

		const statusEl = document.getElementById('attrset-editor-status');
		const currentInXsl = extractAttrSetFromXsl(activeAttrSet);
		const stored = attrSets[activeAttrSet];

		if (!currentInXsl) {
			statusEl.textContent = '⚠ Not in XSL';
			statusEl.className = 'template-status modified';
		} else if (currentInXsl !== stored) {
			statusEl.textContent = '● Modified';
			statusEl.className = 'template-status modified';
		} else {
			statusEl.textContent = '✓ Synced';
			statusEl.className = 'template-status';
		}
	}

	function discardAttrSetChanges() {
		if (!activeAttrSet) return;

		const currentInXsl = extractAttrSetFromXsl(activeAttrSet);
		if (currentInXsl) {
			attrSets[activeAttrSet] = currentInXsl;
			document.getElementById('attrSetEditorInput').value = currentInXsl;
			updateAttrSetEditorStatus();
			saveProject();
		} else {
			if (confirm(`Attribute set "${activeAttrSet}" not found in main XSL. Remove from editor?`)) {
				delete attrSets[activeAttrSet];
				activeAttrSet = null;
				hideAttrSetEditor();
				refreshAttrSetNav();
				saveProject();
			}
		}
	}

	function updateAttrSetInXsl() {
		if (!activeAttrSet) return;

		const xsl = document.getElementById('xslInput').value;
		const newContent = attrSets[activeAttrSet];

		const currentInXsl = extractAttrSetFromXsl(activeAttrSet);

		if (!currentInXsl) {
			alert(
				`Attribute set "${activeAttrSet}" was not found in the main XSL.\n\n` +
				`To re-establish it:\n` +
				`1. Copy the attribute set content from the editor below\n` +
				`2. Paste it into the main XSL at the desired location\n` +
				`3. Click "Discard" to sync the editor with the main XSL`
			);
			return;
		}

		const newXsl = xsl.replace(currentInXsl, newContent);
		document.getElementById('xslInput').value = newXsl;

		updateAttrSetEditorStatus();
		saveProject();

		// Visual feedback
		const btn = event.target;
		const originalText = btn.textContent;
		btn.textContent = '✓ Updated!';
		btn.style.background = '#43a047';
		setTimeout(() => {
			btn.textContent = originalText;
			btn.style.background = '';
		}, 1500);
	}

// Helper: Evaluate Attribute Value Templates (AVTs)
// Replaces {$param} and {xpath} patterns with their values
function evaluateAVT(template, dataContext) {
    if (!template || !template.includes('{')) return template;

    return template.replace(/\{([^}]+)\}/g, (match, expr) => {
        expr = expr.trim();
        if (expr.startsWith('$')) {
            // Parameter reference
            const paramName = expr.substring(1);
            if (dataContext._params && dataContext._params[paramName] !== undefined) {
                return dataContext._params[paramName];
            }
            return match; // Return original if param not found
        } else {
            // XPath expression
            const xmlCtx = dataContext._xmlContext || dataContext;
            return evaluateXPath(expr, xmlCtx);
        }
    });
}

function mapToHtml(xmlNode, dataContext) {
    // Handle text nodes
    if (xmlNode.nodeType === 3) {
        const text = xmlNode.textContent;
        // Skip whitespace-only text nodes that contain newlines (XML formatting/indentation)
        // This prevents unwanted gaps between inline-block elements like inline-container
        if (/^\s*$/.test(text) && text.includes('\n')) {
            return null;
        }
        return document.createTextNode(text);
    }

    // Skip comment nodes (nodeType 8)
    if (xmlNode.nodeType === 8) return null;

    const ln = xmlNode.localName;
    const ns = xmlNode.namespaceURI;
    const isXSL = ns?.includes("Transform");

    // --- XSL LOGIC ---
    if (isXSL) {
        if (ln === "value-of") {
            const selectAttr = xmlNode.getAttribute('select');
            let val;

            // Check if it's a parameter reference ($paramName)
            if (selectAttr.startsWith('$')) {
                const paramName = selectAttr.substring(1);
                if (dataContext._params && dataContext._params[paramName] !== undefined) {
                    val = dataContext._params[paramName];
                } else {
                    val = `[$${paramName}]`; // Placeholder for undefined params
                }
            } else {
                // Regular XPath evaluation
                const xmlCtx = dataContext._xmlContext || dataContext;
                val = evaluateXPath(selectAttr, xmlCtx);
            }

            const span = document.createElement('span');
            span.style.color = '#2980b9';
            span.innerText = val;
            return span;
        }

        if (ln === "for-each") {
            const frag = document.createDocumentFragment();
            const xmlCtx = dataContext._xmlContext || dataContext;
            const nodes = (xmlCtx.ownerDocument || xmlCtx).evaluate(xmlNode.getAttribute('select'), xmlCtx, null, 7, null);
            for (let i = 0; i < nodes.snapshotLength; i++) {
                Array.from(xmlNode.childNodes).forEach(c => {
                    const res = mapToHtml(c, nodes.snapshotItem(i));
                    if (res instanceof Node) frag.appendChild(res);
                });
            }
            return frag;
        }

        if (ln === "call-template") {
            const name = xmlNode.getAttribute('name');
            const templates = xmlNode.ownerDocument.getElementsByTagNameNS("*", "template");
            let def = null;
            for (let t of templates) {
                if (t.getAttribute('name') === name) {
                    def = t;
                    break;
                }
            }
            if (def) {
                // Collect xsl:with-param values from call-template
                const params = {};
                Array.from(xmlNode.childNodes).forEach(child => {
                    if (child.localName === 'with-param') {
                        const paramName = child.getAttribute('name');
                        const selectAttr = child.getAttribute('select');
                        if (selectAttr) {
                            // xsl:with-param select="xpath"
                            params[paramName] = evaluateXPath(selectAttr, dataContext);
                        } else {
                            // xsl:with-param with text content
                            params[paramName] = child.textContent.trim();
                        }
                    }
                });

                // Merge params with dataContext for template rendering
                const templateContext = { _xmlContext: dataContext, _params: params };

                const frag = document.createDocumentFragment();
                Array.from(def.childNodes).forEach(c => {
                    const res = mapToHtml(c, templateContext);
                    if (res instanceof Node) frag.appendChild(res);
                });
                return frag;
            } else {
                const err = document.createElement('span');
                err.style.color = 'red';
                err.innerText = `[Template "${name}" Not Found]`;
                return err;
            }
        }

        if (ln === "attribute") {
            const attrName = xmlNode.getAttribute('name');
            let attrValue = "";
            Array.from(xmlNode.childNodes).forEach(c => {
                const nodeName = c.localName || c.nodeName.split(':').pop();
                if (nodeName === "value-of") {
                    attrValue += evaluateXPath(c.getAttribute('select'), dataContext);
                } else if (c.nodeType === 3) {
                    attrValue += c.textContent;
                }
            });
            attrValue = attrValue.trim();
            if (attrName === 'src') {
                attrValue = attrValue.replace(/^url\(['"]?/, '').replace(/['"]?\)$/, '');
                let resolvedSrc = virtualImages[attrValue] || library[attrValue] || attrValue;
                if (!resolvedSrc || resolvedSrc.trim() === "") {
                    attrValue = MISSING_IMAGE_SVG;
                } else {
                    attrValue = resolvedSrc;
                }
            }
            return { type: 'attribute', name: attrName, value: attrValue };
        }

        // Default XSL container (like xsl:if, xsl:choose)
        const frag = document.createDocumentFragment();
        Array.from(xmlNode.childNodes).forEach(c => {
            const childResult = mapToHtml(c, dataContext);
            if (childResult instanceof Node) frag.appendChild(childResult);
        });
        return frag;
    }

    // --- FO LAYOUT ---
    const tagMap = {
        'table': 'table',
        'table-header': 'thead',
        'table-body': 'tbody',
        'table-footer': 'tfoot',
        'table-row': 'tr',
        'table-cell': 'td',
        'table-column': 'col',
        'leader': 'span',
        'page-number': 'span',
        'page-number-citation-last': 'span',
        'static-content': 'div',
        'external-graphic': 'img',
        'inline': 'span',
        'inline-container': 'span',
        'block': 'div'
    };

    const el = document.createElement(tagMap[ln] || 'div');

    // Check for page breaks (applies to fo:block elements)
    let pageBreakBefore = false;
    let pageBreakAfter = false;
    if (ns?.includes("Format") && ln === 'block') {
        const breakBefore = xmlNode.getAttribute('break-before');
        const breakAfter = xmlNode.getAttribute('break-after');
        if (breakBefore === 'page') pageBreakBefore = true;
        if (breakAfter === 'page') pageBreakAfter = true;
    }

    if (ns?.includes("Format")) {
        // 1. Handle Attribute Sets (Lookup phase)
        // Check for both use-attribute-sets and xsl:use-attribute-sets (with namespace prefix)
        const attrSetNames = xmlNode.getAttribute('use-attribute-sets') || xmlNode.getAttribute('xsl:use-attribute-sets');
        if (attrSetNames) {
            attrSetNames.split(/\s+/).forEach(setName => {
                const sets = xmlNode.ownerDocument.getElementsByTagNameNS("*", "attribute-set");
                for (let set of sets) {
                    if (set.getAttribute('name') === setName) {
                        Array.from(set.childNodes).forEach(attrNode => {
                            if (attrNode.localName === 'attribute') {
                                const aName = attrNode.getAttribute('name');
                                const aVal = attrNode.textContent.trim();
                                if (SUPPORTED_FO_STYLES[aName]) el.style[SUPPORTED_FO_STYLES[aName]] = aVal;
                                else el.setAttribute(aName, aVal);
                            }
                        });
                    }
                }
            });
        }

        // 2. Apply Direct FO Attributes (overrides sets) using global mapping
        // Use AVT evaluation to handle {$param} patterns
        for (let [foAttr, jsProp] of Object.entries(SUPPORTED_FO_STYLES)) {
            const val = xmlNode.getAttribute(foAttr);
            if (val) el.style[jsProp] = evaluateAVT(val, dataContext);
        }

        // 3. Special Case: display-align (vertical alignment for block containers)
        const displayAlign = xmlNode.getAttribute('display-align');
        if (displayAlign) {
            const vAlignMap = { 'before': 'top', 'center': 'middle', 'after': 'bottom' };
            el.style.verticalAlign = vAlignMap[displayAlign] || displayAlign;
        }

        // 3b. Special Case: alignment-baseline (vertical alignment for inline elements)
        const alignmentBaseline = xmlNode.getAttribute('alignment-baseline');
        if (alignmentBaseline) {
            // FO alignment-baseline values map fairly directly to CSS vertical-align
            el.style.verticalAlign = alignmentBaseline;
        }

        // 3c. Special Case: keep-together.within-line (prevent line breaks)
        const keepTogether = xmlNode.getAttribute('keep-together.within-line');
        if (keepTogether === 'always') {
            el.style.whiteSpace = 'nowrap';
        }

        // 4. Component-specific Logic
        if (ln === 'table') { 
            el.style.width = "100%"; 
            el.style.borderCollapse = "collapse"; 
        }

        if (ln === 'table-column') {
            const colWidth = xmlNode.getAttribute('column-width');
            if (colWidth) el.style.width = colWidth;
        }

        if (ln === 'table-cell') {
            const colSpan = xmlNode.getAttribute('number-columns-spanned');
            if (colSpan) el.colSpan = colSpan;
            const rowSpan = xmlNode.getAttribute('number-rows-spanned');
            if (rowSpan) el.rowSpan = rowSpan;
            // Default vertical align if not specified
            if (!el.style.verticalAlign) el.style.verticalAlign = 'top';
        }

        if (ln === 'inline-container') {
            el.style.display = 'inline-block';
            el.style.verticalAlign = 'middle';
        }

        if (ln === 'external-graphic') {
            let src = xmlNode.getAttribute('src') || "";
            // Evaluate AVTs in src attribute, then clean url() wrapper
            src = evaluateAVT(src, dataContext);
            src = src.replace(/^url\(['"]?/, '').replace(/['"]?\)$/, '');
            let resolvedSrc = virtualImages[src] || library[src] || src;
            // Fall back to MISSING_IMAGE_SVG if src is empty or unresolved
            if (!resolvedSrc || resolvedSrc.trim() === "") {
                el.src = MISSING_IMAGE_SVG;
            } else {
                el.src = resolvedSrc;
            }
            const width = evaluateAVT(xmlNode.getAttribute('width') || '', dataContext);
            const contentWidth = xmlNode.getAttribute('content-width');
            const height = xmlNode.getAttribute('content-height');
            if (width) el.style.width = width;
            if (contentWidth && contentWidth !== 'scale-to-fit') el.style.width = contentWidth;
            if (height) el.style.height = height;
            el.style.display = 'inline-block';
            el.alt = "XSL-FO Graphic";
            el.style.maxWidth = '100%';
        }

        if (ln === 'page-number') {
            el.innerText = "1";
            el.className = 'fo-page-number';
            el.style.display = 'inline';
        }

        if (ln === 'page-number-citation-last') {
            el.innerText = "N";
            el.className = 'fo-page-number-citation-last';
            el.style.display = 'inline';
        }

        if (ln === 'leader') {
            const len = xmlNode.getAttribute('leader-length');
            const pattern = xmlNode.getAttribute('leader-pattern') || 'space';
            const thickness = xmlNode.getAttribute('rule-thickness') || '1pt';
            const leaderColor = xmlNode.getAttribute('color');

            // Determine if this leader should "fill" available space
            // Fill ONLY when no length specified at all
            // If leader-length is explicitly set (any value), honor it and don't apply flex
            const shouldFill = !len;

            el.style.display = 'inline-block';

            if (shouldFill) {
                // Flex-based fill mode (activated by post-processor if toggle enabled)
                el.className = 'fo-leader-fill pattern-' + pattern;
            } else {
                // Fixed-length mode
                el.style.verticalAlign = 'baseline';
            }

            // Always map leader-length to width when specified
            if (len) {
                el.style.width = len;
            }

            // Apply pattern styling
            if (pattern === 'dots') el.style.borderBottom = `${thickness} dotted currentColor`;
            else if (pattern === 'rule') el.style.borderBottom = `${thickness} solid currentColor`;

            if (leaderColor) el.style.borderColor = leaderColor;
        }
    }

    // Recursively process children
    Array.from(xmlNode.childNodes).forEach(c => {
        const childResult = mapToHtml(c, dataContext);

        if (childResult && childResult.type === 'attribute') {
            // Apply dynamic attributes using the global style map
            if (childResult.name === 'src' && el.tagName === 'IMG') {
                el.src = childResult.value;
            } else if (SUPPORTED_FO_STYLES[childResult.name]) {
                el.style[SUPPORTED_FO_STYLES[childResult.name]] = childResult.value;
            } else {
                el.setAttribute(childResult.name, childResult.value);
            }
        } else if (childResult instanceof Node) {
            el.appendChild(childResult);
        }
    });

    // Handle page breaks by wrapping element with markers
    if (pageBreakBefore || pageBreakAfter) {
        const frag = document.createDocumentFragment();
        if (pageBreakBefore) {
            const marker = document.createElement('div');
            marker.className = 'page-break-marker';
            marker.dataset.breakType = 'before';
            frag.appendChild(marker);
        }
        frag.appendChild(el);
        if (pageBreakAfter) {
            const marker = document.createElement('div');
            marker.className = 'page-break-marker';
            marker.dataset.breakType = 'after';
            frag.appendChild(marker);
        }
        return frag;
    }

    return el;
}
</script>
